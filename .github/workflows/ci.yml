name: VentureFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  server-ci:
    name: Server Checks & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Server Typecheck
        working-directory: ./server
        run: npm run typecheck

      - name: Run Integration Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/ventureflow_test
          JWT_SECRET: ci_secret_key_testing_environment_only_12345
          CLIENT_ORIGIN: http://localhost:5173
        run: npm test

      - name: Server Production Build
        working-directory: ./server
        run: npm run build

  client-ci:
    name: Client Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Client Typecheck
        working-directory: ./client
        run: npm run typecheck

      - name: Client Production Build
        working-directory: ./client
        run: npm run build
